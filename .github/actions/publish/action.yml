name: Heidi Fix - publish
description: >-
  Opens a pull request for each verified fix of the job "fix". This job runs no agent and no build tool.
  The checkout must keep the publication token in its git configuration.

inputs:
  config:
    description: The repository file of Heidi Fix.
    required: false
    default: .heidi-fix.yml
  github-token:
    description: The token that pushes the branches and opens the pull requests.
    required: true
  run-directory:
    description: The folder for the run of the job "fix". It must be outside the checkout. Empty gives $RUNNER_TEMP/heidi-fix-run.
    required: false
    default: ''
  fail-on-error:
    description: true makes the action fail when Heidi Fix fails. The reusable workflow sets false, because its job "result" decides.
    required: false
    default: 'true'
  current-branch:
    description: The form of --current-branch of the job fix, split, chain, or empty.
    required: false
    default: ''
  start-commit:
    description: The output start-commit of the action fix. A form in current-branch needs it.
    required: false
    default: ''
  replace-branches:
    description: true replaces the fix branches and the pull requests of an earlier run, with --replace-branches.
    required: false
    default: 'false'

outputs:
  publish-exit-code:
    description: The exit code of "heidi-fix publish".
    value: ${{ steps.publish.outputs.publish-exit-code }}

runs:
  using: composite
  steps:
    - name: Choose the run directory
      id: directory
      shell: bash
      env:
        RUN_DIRECTORY: ${{ inputs.run-directory }}
      run: echo "path=${RUN_DIRECTORY:-$RUNNER_TEMP/heidi-fix-run}" >> "$GITHUB_OUTPUT"

    - name: Get the run of the job fix
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: heidi-fix-run
        path: ${{ steps.directory.outputs.path }}

    - name: Get the branches of the fixes
      shell: bash
      env:
        RUN_DIRECTORY: ${{ steps.directory.outputs.path }}
        CURRENT_BRANCH_FORM: ${{ inputs.current-branch }}
        START_COMMIT: ${{ inputs.start-commit }}
      run: |
        fetch_fixes="$GITHUB_ACTION_PATH/../../../scripts/fetch-fixes.sh"
        fetch_arguments=("$RUN_DIRECTORY/fixes.bundle")
        if [ "$CURRENT_BRANCH_FORM" = chain ]; then
          # The checkout of this job, not the report of the job fix, gives the current branch.
          if ! current_reference="$(git symbolic-ref --quiet HEAD)"; then
            echo "::error::HEAD is a detached commit, so the chain form has no current branch."
            exit 1
          fi
          current_branch="${current_reference#refs/heads/}"
          fetch_arguments+=("$current_branch" "$START_COMMIT")
        fi
        # The ref names of the bundle cannot give workflow commands until the end token.
        stop_token="$(openssl rand -hex 16)"
        echo "::stop-commands::${stop_token}"
        set +e
        bash "$fetch_fixes" "${fetch_arguments[@]}"
        exit_code=$?
        set -e
        echo "::${stop_token}::"
        if [ "$exit_code" -ne 0 ]; then
          echo "::error::Heidi Fix cannot get the fixes from the bundle. Read the log of the step."
          exit "$exit_code"
        fi

    - name: Install Heidi Fix
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/install-heidi-fix.sh"

    - name: Publish the fixes
      id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CONFIG: ${{ inputs.config }}
        RUN_DIRECTORY: ${{ steps.directory.outputs.path }}
        REPLACE_BRANCHES: ${{ inputs.replace-branches }}
        CURRENT_BRANCH_FORM: ${{ inputs.current-branch }}
        START_COMMIT: ${{ inputs.start-commit }}
      run: |
        options=()
        if [ "$REPLACE_BRANCHES" = true ]; then
          options+=(--replace-branches)
        fi
        # The inputs of this job, not the report of the job fix, give the form and the start commit of the run.
        if [ "$CURRENT_BRANCH_FORM" = split ]; then
          options+=(--current-branch=split)
        elif [ "$CURRENT_BRANCH_FORM" = chain ]; then
          options+=(--current-branch)
        fi
        if [ -n "$CURRENT_BRANCH_FORM" ]; then
          if [ -z "$START_COMMIT" ]; then
            echo "::error::The input start-commit is empty, so Heidi Fix cannot check the run of the job fix."
            exit 1
          fi
          options+=(--start-commit "$START_COMMIT")
        fi
        output="$RUNNER_TEMP/heidi-fix-publish.txt"
        # The files of the job fix cannot give workflow commands until the end token.
        stop_token="$(openssl rand -hex 16)"
        echo "::stop-commands::${stop_token}"
        set +e
        "$HEIDI_FIX_PROGRAM" publish --from "$RUN_DIRECTORY" --publish github ${options[@]+"${options[@]}"} \
          --config "$CONFIG" --run-dir "$RUNNER_TEMP/heidi-fix-publish" --no-color . 2>&1 | tee "$output"
        exit_code=${PIPESTATUS[0]}
        set -e
        echo "::${stop_token}::"
        echo "publish-exit-code=$exit_code" >> "$GITHUB_OUTPUT"
        {
          echo "## Publication"
          echo
          echo '<pre>'
          sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' "$output"
          echo '</pre>'
          if grep --quiet "not permitted to create or approve pull requests" "$output"; then
            echo
            echo "Turn on the setting \"Allow GitHub Actions to create and approve pull requests\" in Settings > Actions > General, or set the secret HEIDI_FIX_GITHUB_TOKEN."
            echo "With HEIDI_FIX_GITHUB_TOKEN, the checks of the repository run on the change of the agent, with the secrets of the repository, before a person reviews it."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail when Heidi Fix fails
      if: always() && inputs.fail-on-error == 'true' && steps.publish.outputs.publish-exit-code != '0'
      shell: bash
      env:
        PUBLISH_EXIT_CODE: ${{ steps.publish.outputs.publish-exit-code }}
      run: |
        echo "::error::heidi-fix publish gives the exit code ${PUBLISH_EXIT_CODE:-unknown}. Read the summary of the job."
        exit 1
